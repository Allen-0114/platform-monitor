version: '3.8'
services:
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://monitor:monitor123@db:5432/platform_monitor
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=monitor
      - POSTGRES_PASSWORD=monitor123
      - POSTGRES_DB=platform_monitor
    ports:
      - "5433:5432"
    volumes:
      - monitor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d platform_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  monitor-db-data:
